name: Perbarui pita berita

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berita
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/berita.py news.json
        continue-on-error: true
      - name: Kondisi ruas (TomTom)
        run: python3 scripts/ruas.py ruas.json
        continue-on-error: true
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
      - name: Commit jika berubah
        run: |
          git add news.json
          [ -f ruas.json ] && git add ruas.json
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Perbarui news.json / ruas.json"
          git pull --rebase origin main
          git push
